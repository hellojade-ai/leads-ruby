AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "examples/**/*"

Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Layout/LineLength:
  Max: 120
Metrics/AbcSize:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Naming/FileName:
  Exclude:
    - "lib/hellojade-intake.rb"
Naming/VariableNumber:
  CheckMethodNames: false
Naming/MethodParameterName:
  MinNameLength: 1
Gemspec/RequireMFA:
  Enabled: false
